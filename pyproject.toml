[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sisyphusfy"
description = "Project-agnostic supervisor for disposable AI-agent sessions"
requires-python = ">=3.10"
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyyaml>=6.0"]

[project.scripts]
sisyphusfy = "sisyphusfy.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sisyphusfy.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
