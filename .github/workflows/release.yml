name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-artifacts:
    # Every matrix entry must build on a runner whose native architecture is the
    # advertised architecture. Targets listed in distribution.DEFERRED_TARGETS
    # are omitted here on purpose; add them back only together with a runner
    # that produces that architecture (see RUNNER_NATIVE_ARCH).
    strategy:
      matrix:
        include:
          - platform: linux
            arch: x86_64
            os: ubuntu-latest
          # Intel macOS builds use macos-15-intel: macos-13 was retired, and
          # building x86_64 on an arm64 runner would mislabel the artifact.
          - platform: darwin
            arch: x86_64
            os: macos-15-intel
          - platform: darwin
            arch: aarch64
            os: macos-14
          - platform: win32
            arch: x86_64
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner architecture matches the advertised target
        shell: bash
        run: |
          case "${{ matrix.arch }}" in
            x86_64) expected="x86_64|amd64|AMD64" ;;
            aarch64) expected="aarch64|arm64|ARM64" ;;
            *) echo "unknown matrix arch: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          actual="$(uname -m)"
          if ! printf '%s' "$actual" | grep -Eq "^($expected)$"; then
            echo "refusing to publish: target is ${{ matrix.arch }} but runner reports $actual" >&2
            exit 1
          fi
          echo "runner architecture ok: $actual"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build pyinstaller

      - name: Build package (sdist/wheel for PyPI)
        run: python -m build --sdist --wheel

      - name: Build executable
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python -m PyInstaller --onefile --name sisyphusfy --paths src src/sisyphusfy/cli.py --distpath pyinstaller_dist
          if [ "${{ matrix.platform }}" = "win32" ]; then EXT=".exe"; else EXT=""; fi
          ARCHIVE="sisyphusfy-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          tar czf "$ARCHIVE" -C pyinstaller_dist "sisyphusfy${EXT}"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sisyphusfy-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.ARCHIVE }}

  publish-release:
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify tag matches package version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(PYTHONPATH=src python -c 'import sisyphusfy; print(sisyphusfy.__version__)')"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "refusing to publish: tag is v$VERSION but package version is $PKG_VERSION" >&2
            exit 1
          fi
          echo "version ok: v$VERSION"

      - name: Generate checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd artifacts
          find . -name "*.tar.gz" -exec sha256sum {} \; | sed 's|.*/||' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/SHA256SUMS.txt

  publish-pypi:
    # Runs after the GitHub Release so a failed release never publishes a
    # package. Requires the PyPI project and a trusted publisher registered for
    # this repository and the `pypi` environment; until then this job fails
    # loudly rather than being skipped.
    needs: publish-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sisyphusfy
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    # npm trusted publishing authenticates this exact workflow through OIDC;
    # configure the trusted publisher on npmjs.org before creating a tag.
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify npm version supports trusted publishing
        run: npm --version

      - name: Publish npm package
        run: npm publish --access public
        working-directory: npm

  test-installers:
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test POSIX installer (dry-run)
        run: |
          chmod +x install.sh
          ./install.sh --dry-run

      - name: Test npm launcher (dry-run)
        run: |
          cd npm
          npm install
          node -e "
          const { getPlatform, getArtifactName, getDownloadUrl } = require('./lib/launcher.js');
          const p = getPlatform();
          const name = getArtifactName('0.1.0', p.platform, p.arch);
          const url = getDownloadUrl('0.1.0', name);
          console.log('Platform:', p);
          console.log('Artifact:', name);
          console.log('URL:', url);
          "

  test-powershell:
    needs: publish-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test PowerShell installer (dry-run)
        run: |
          .\install.ps1 -DryRun

  verify-powershell-syntax:
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify PowerShell installer syntax (skip if unavailable)
        shell: bash
        run: |
          bin=""
          for c in pwsh powershell; do
            if command -v "$c" >/dev/null 2>&1; then
              if "$c" -NoProfile -NonInteractive -Command '"ok"' >/dev/null 2>&1; then
                bin="$c"
                break
              fi
            fi
          done
          if [ -n "$bin" ]; then
            "$bin" -NoProfile -NonInteractive -Command "\$errors=\$null; [System.Management.Automation.Language.Parser]::ParseFile('install.ps1', [ref]\$null, [ref]\$errors); if (\$errors.Count -gt 0) { Write-Error (\$errors | Out-String); exit 1 }"
          else
            echo "SKIP: PowerShell runtime not available or not executable on this runner; installer syntax check skipped"
          fi

  verify-links:
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify repository link
        run: |
          curl -fsSL -o /dev/null "https://github.com/lileililiwen/sisyphusfy"

      - name: Verify releases link
        run: |
          curl -fsSL -o /dev/null "https://github.com/lileililiwen/sisyphusfy/releases"

      - name: Verify website link
        run: |
          curl -fsSL -o /dev/null "https://sisyphusfy.dev/" || echo "Website not configured yet"
